    lxml613: lxml==6.1.3
setenv =
  LC_ALL=C.UTF-8
allowlist_externals = uv, pytest
commands =
    pytest -n 4 --dist loadfile

[testenv:py312-lxml{502,522,532,540,604,613}]
passenv = PYTHON_VERSION
deps =
    lxml502: lxml==5.0.2
    lxml522: lxml==5.2.2
    lxml532: lxml==5.3.2
    lxml540: lxml==5.4.0
    lxml604: lxml==6.0.4
    lxml613: lxml==6.1.3
setenv =
  LC_ALL=C.UTF-8
allowlist_externals = uv, pytest
commands =
    pytest -n 4 --dist loadfile

[testenv:py313-lxml{532,540,604,613}]
passenv = PYTHON_VERSION
deps =
    lxml532: lxml==5.3.2
    lxml540: lxml==5.4.0
    lxml604: lxml==6.0.4
    lxml613: lxml==6.1.3
setenv =
  LC_ALL=C.UTF-8
allowlist_externals = uv, pytest
