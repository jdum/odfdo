[tox]
envlist =
    lint,
    py310-lxml{48,49,511,604,613}
    py311-lxml{49,511,522,532,540,604,613}
    py312-lxml{502,522,532,540,604,613}
    py313-lxml{532,540,604,613}
    py314-lxml{604,613}
    py314-lxml{700}
    py315-lxml{604,613}

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: lint, py314
    3.15: py315

[testenv:py310-lxml{48,49}]
passenv = PYTHON_VERSION
deps =
    lxml48: lxml==4.8.0
    lxml49: lxml==4.9.4
setenv =
  LC_ALL=C.UTF-8
allowlist_externals = uv, pytest
commands =
    pytest -n 4 --dist loadfile

[testenv:py310-lxml{511}]
passenv = PYTHON_VERSION
deps =
    lxml511: lxml==5.1.1
setenv =
  LC_ALL=C.UTF-8
allowlist_externals = uv, pytest
commands =
    pytest -n 4 --dist loadfile

[testenv:py310-lxml{604,613}]
passenv = PYTHON_VERSION
deps =
    lxml604: lxml==6.0.4
    lxml613: lxml==6.1.3
setenv =
  LC_ALL=C.UTF-8
allowlist_externals = uv, pytest
commands =
    pytest -n 4 --dist loadfile

[testenv:py311-lxml{49,511,522,532,540,604,613}]
passenv = PYTHON_VERSION
deps =
    lxml49: lxml==4.9.4
    lxml511: lxml==5.1.1
    lxml522: lxml==5.2.2
    lxml532: lxml==5.3.2
    lxml540: lxml==5.4.0
